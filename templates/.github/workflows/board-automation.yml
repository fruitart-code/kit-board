# Board Automation — auto-move issues on the project board
#
# What it does:
#   1. PR opened/reopened → linked issue moves to "На ревью"
#   2. PR review approved → linked issue moves to "Одобрено"
#   3. PR opened → remove PR card from board (board = issues only)
#   4. Branch created with issue number → issue moves to "В работе"
#   5. Issue closed → board status moves to "🏁 Готово" (closes lifecycle gap;
#      built-in "Item closed" workflow GitHub Projects не используем)
#   6. Issue opened/labeled with reports.exclude_labels → archive on board
#      (workflow-generated reports — pinned в Issues, не units of work;
#      archive вместо delete, чтобы можно было one-click restore)
#   7. Daily cron (Mon-Fri 09:00 UTC) → archive items in "Готово"
#
# Requires: repository secret PROJECT_TOKEN (classic PAT with `project` + `repo` scopes)

name: Board Automation

on:
  pull_request:
    types: [opened, reopened, closed]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed, opened, labeled, reopened]
  create:
  schedule:
    # Mon-Fri at 09:00 UTC (12:00 Almaty) — archive completed items
    - cron: '0 9 * * 1-5'

env:
  PROJECT_ID: "PVT_kwDOD-bbkc4BSR5o"
  STATUS_FIELD_ID: "PVTSSF_lADOD-bbkc4BSR5ozg_3HtU"
  STATUS_BACKLOG: "16feffd5"
  STATUS_TODO: "eda2013a"
  STATUS_IN_PROGRESS: "6a949393"
  STATUS_IN_REVIEW: "f46b221d"
  STATUS_APPROVED: "03a27fb8"
  STATUS_DONE: "7532db38"

jobs:
  # ─── PR opened/reopened → move linked issues to "На ревью" + remove PR from board ───
  pr-opened:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Move linked issues to "На ревью"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Parse issue numbers from "Closes #N", "Fixes #N", "Resolves #N"
          ISSUE_NUMBERS=$(echo "$PR_BODY" | grep -oiP '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\K\d+' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found in PR body"
            exit 0
          fi

          for ISSUE_NUM in $ISSUE_NUMBERS; do
            echo "Processing issue #$ISSUE_NUM..."

            # Get issue node ID
            ISSUE_NODE_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.node_id' 2>/dev/null || true)
            if [ -z "$ISSUE_NODE_ID" ]; then
              echo "  Issue #$ISSUE_NUM not found, skipping"
              continue
            fi

            # Ensure issue is on the board (idempotent)
            ITEM_ID=$(gh api graphql -f query="
              mutation {
                addProjectV2ItemById(input: {
                  projectId: \"$PROJECT_ID\"
                  contentId: \"$ISSUE_NODE_ID\"
                }) { item { id } }
              }" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)

            if [ -z "$ITEM_ID" ]; then
              echo "  Could not add issue #$ISSUE_NUM to board, skipping"
              continue
            fi

            # Move to "На ревью"
            gh api graphql -f query="
              mutation {
                updateProjectV2ItemFieldValue(input: {
                  projectId: \"$PROJECT_ID\"
                  itemId: \"$ITEM_ID\"
                  fieldId: \"$STATUS_FIELD_ID\"
                  value: { singleSelectOptionId: \"$STATUS_IN_REVIEW\" }
                }) { projectV2Item { id } }
              }" > /dev/null 2>&1

            echo "  Issue #$ISSUE_NUM → На ревью"
          done

      - name: Remove PR from board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Wait for auto-add workflow to finish adding PR to board
          sleep 5

          # Find PR's project item ID
          PR_ITEM_ID=$(gh api graphql -f query="
            {
              repository(owner: \"$REPO_OWNER\", name: \"$REPO_NAME\") {
                pullRequest(number: $PR_NUMBER) {
                  projectItems(first: 10) {
                    nodes {
                      id
                      project { id }
                    }
                  }
                }
              }
            }" --jq ".data.repository.pullRequest.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" 2>/dev/null || true)

          if [ -n "$PR_ITEM_ID" ]; then
            gh api graphql -f query="
              mutation {
                deleteProjectV2Item(input: {
                  projectId: \"$PROJECT_ID\"
                  itemId: \"$PR_ITEM_ID\"
                }) { deletedItemId }
              }" > /dev/null 2>&1
            echo "PR #$PR_NUMBER removed from board"
          else
            echo "PR #$PR_NUMBER not on board (or not yet added)"
          fi

  # ─── PR review approved → move linked issues to "Одобрено" ───
  review-approved:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Move linked issues to "Одобрено"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          ISSUE_NUMBERS=$(echo "$PR_BODY" | grep -oiP '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\K\d+' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found in PR body"
            exit 0
          fi

          for ISSUE_NUM in $ISSUE_NUMBERS; do
            echo "Processing issue #$ISSUE_NUM..."

            ISSUE_NODE_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.node_id' 2>/dev/null || true)
            if [ -z "$ISSUE_NODE_ID" ]; then
              echo "  Issue #$ISSUE_NUM not found, skipping"
              continue
            fi

            ITEM_ID=$(gh api graphql -f query="
              mutation {
                addProjectV2ItemById(input: {
                  projectId: \"$PROJECT_ID\"
                  contentId: \"$ISSUE_NODE_ID\"
                }) { item { id } }
              }" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)

            if [ -z "$ITEM_ID" ]; then
              echo "  Could not find issue #$ISSUE_NUM on board, skipping"
              continue
            fi

            gh api graphql -f query="
              mutation {
                updateProjectV2ItemFieldValue(input: {
                  projectId: \"$PROJECT_ID\"
                  itemId: \"$ITEM_ID\"
                  fieldId: \"$STATUS_FIELD_ID\"
                  value: { singleSelectOptionId: \"$STATUS_APPROVED\" }
                }) { projectV2Item { id } }
              }" > /dev/null 2>&1

            echo "  Issue #$ISSUE_NUM → Одобрено"
          done

  # ─── PR merged → check review status → move linked issues to "Одобрено" ───
  pr-merged:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check review status and move to "Одобрено"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Check if PR had an approved review
          APPROVED=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '[.[] | select(.state == "APPROVED")] | length' 2>/dev/null || echo "0")

          if [ "$APPROVED" -eq 0 ]; then
            echo "PR #$PR_NUMBER merged without approve, skipping Одобрено step"
            exit 0
          fi

          echo "PR #$PR_NUMBER has $APPROVED approve(s)"

          # Parse linked issues
          ISSUE_NUMBERS=$(echo "$PR_BODY" | grep -oiP '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\K\d+' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found"
            exit 0
          fi

          for ISSUE_NUM in $ISSUE_NUMBERS; do
            echo "Processing issue #$ISSUE_NUM..."

            ISSUE_NODE_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.node_id' 2>/dev/null || true)
            if [ -z "$ISSUE_NODE_ID" ]; then
              continue
            fi

            ITEM_ID=$(gh api graphql -f query="
              mutation {
                addProjectV2ItemById(input: {
                  projectId: \"$PROJECT_ID\"
                  contentId: \"$ISSUE_NODE_ID\"
                }) { item { id } }
              }" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)

            if [ -z "$ITEM_ID" ]; then
              continue
            fi

            # Move to "Одобрено" — built-in "Item closed" workflow will then move to "Готово"
            gh api graphql -f query="
              mutation {
                updateProjectV2ItemFieldValue(input: {
                  projectId: \"$PROJECT_ID\"
                  itemId: \"$ITEM_ID\"
                  fieldId: \"$STATUS_FIELD_ID\"
                  value: { singleSelectOptionId: \"$STATUS_APPROVED\" }
                }) { projectV2Item { id } }
              }" > /dev/null 2>&1

            echo "  Issue #$ISSUE_NUM → Одобрено"
          done

  # ─── Branch created → move issue to "В работе" ───
  branch-created:
    if: >
      github.event_name == 'create' &&
      github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to "В работе"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BRANCH: ${{ github.event.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "Branch created: $BRANCH"

          # Extract issue number from branch name
          # Supports: feature/issue-42-desc, proposal/issue-42-name, fix/42-bug, docs/issue-42
          ISSUE_NUM=$(echo "$BRANCH" | grep -oP '(?:issue-?)?\K\d+' | head -1 || true)

          if [ -z "$ISSUE_NUM" ]; then
            echo "No issue number found in branch name, skipping"
            exit 0
          fi

          echo "Found issue #$ISSUE_NUM in branch name"

          # Verify issue exists and is open
          ISSUE_STATE=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.state' 2>/dev/null || true)
          if [ "$ISSUE_STATE" != "open" ]; then
            echo "Issue #$ISSUE_NUM is not open (state: $ISSUE_STATE), skipping"
            exit 0
          fi

          ISSUE_NODE_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.node_id' 2>/dev/null || true)

          ITEM_ID=$(gh api graphql -f query="
            mutation {
              addProjectV2ItemById(input: {
                projectId: \"$PROJECT_ID\"
                contentId: \"$ISSUE_NODE_ID\"
              }) { item { id } }
            }" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)

          if [ -z "$ITEM_ID" ]; then
            echo "Could not find issue #$ISSUE_NUM on board, skipping"
            exit 0
          fi

          gh api graphql -f query="
            mutation {
              updateProjectV2ItemFieldValue(input: {
                projectId: \"$PROJECT_ID\"
                itemId: \"$ITEM_ID\"
                fieldId: \"$STATUS_FIELD_ID\"
                value: { singleSelectOptionId: \"$STATUS_IN_PROGRESS\" }
              }) { projectV2Item { id } }
            }" > /dev/null 2>&1

          echo "Issue #$ISSUE_NUM → В работе"

  # ─── Issue closed → board status = "🏁 Готово" ──────────────────────────────
  # Закрывает lifecycle gap: GitHub Projects built-in "Item closed" workflow
  # требует ручной настройки в UI и часто игнорируется при bootstrap. Без
  # этого job-а closed issues застревают в pre-Done колонках (Одобрено /
  # На ревью / etc), auto-archive не имеет что обрабатывать.
  #
  # Этот workflow upgrade-only: запрещён downgrade из В работе/На ревью/
  # Одобрено/Готово обратно (см. ADR §2.6). На `reopened` мы намеренно
  # ничего не делаем — пользователь руками выставит правильную колонку.
  issue-closed:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Move closed issue to "Готово"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Ensure issue is on the board + get item id (idempotent)
          ITEM_ID=$(gh api graphql -f query="
            mutation {
              addProjectV2ItemById(input: {
                projectId: \"$PROJECT_ID\"
                contentId: \"$ISSUE_NODE_ID\"
              }) { item { id } }
            }" --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)

          if [ -z "$ITEM_ID" ]; then
            echo "Could not resolve item id for issue #$ISSUE_NUMBER, skipping"
            exit 0
          fi

          gh api graphql -f query="
            mutation {
              updateProjectV2ItemFieldValue(input: {
                projectId: \"$PROJECT_ID\"
                itemId: \"$ITEM_ID\"
                fieldId: \"$STATUS_FIELD_ID\"
                value: { singleSelectOptionId: \"$STATUS_DONE\" }
              }) { projectV2Item { id } }
            }" > /dev/null 2>&1

          echo "Issue #$ISSUE_NUMBER → Готово"

  # ─── Workflow-generated reports → off the board ────────────────────────────
  # Issues с labels из config.yml::reports.exclude_labels — pinned в Issues,
  # не units of work. Архивируем (не удаляем) их с board сразу после
  # opened/labeled.
  #
  # Почему archive, а не delete:
  #   - report-issue остаётся в Issues view (это pinned snapshot)
  #   - archive можно одним кликом отменить через UI ("Restore from archive")
  #   - то же самое делает `auto-archive` cron с Готово-items — единый паттерн
  #   - delete используем только для PR-карточек (PR концептуально не часть board)
  # Idempotent: повторный archive уже архивного item — no-op на нашей стороне.
  remove-reports-from-board:
    if: >
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.action == 'labeled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout (for config.yml)
        uses: actions/checkout@v4

      - name: Resolve exclude_labels from config
        id: cfg
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            cp.execSync('npm install js-yaml --no-save --silent', { stdio: 'inherit' });
            const yaml = require('js-yaml');
            const cfg = yaml.load(fs.readFileSync('.github/board/config.yml', 'utf8'));
            const labels = cfg.reports?.exclude_labels || [];
            core.setOutput('labels_json', JSON.stringify(labels));
            core.setOutput('count', String(labels.length));

      - name: Check label + archive on board
        if: steps.cfg.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          EXCLUDE_LABELS_JSON: ${{ steps.cfg.outputs.labels_json }}
        run: |
          ISSUE_LABELS=$(gh api "repos/$REPO_OWNER/$REPO_NAME/issues/$ISSUE_NUMBER" \
            --jq '.labels[].name' 2>/dev/null || true)

          MATCHED=$(echo "$EXCLUDE_LABELS_JSON" | jq -r '.[]' | while IFS= read -r excl; do
            if echo "$ISSUE_LABELS" | grep -Fxq "$excl"; then
              echo "$excl"
              break
            fi
          done)

          if [ -z "$MATCHED" ]; then
            echo "Issue #$ISSUE_NUMBER has no report-label, leaving on board"
            exit 0
          fi

          echo "Issue #$ISSUE_NUMBER has label '$MATCHED' → archiving on board"

          ITEM_ID=$(gh api graphql -f query="
            {
              repository(owner: \"$REPO_OWNER\", name: \"$REPO_NAME\") {
                issue(number: $ISSUE_NUMBER) {
                  projectItems(first: 10) {
                    nodes { id project { id } }
                  }
                }
              }
            }" --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" 2>/dev/null || true)

          if [ -z "$ITEM_ID" ]; then
            echo "Issue #$ISSUE_NUMBER not on board (or already archived)"
            exit 0
          fi

          gh api graphql -f query="
            mutation {
              archiveProjectV2Item(input: {
                projectId: \"$PROJECT_ID\"
                itemId: \"$ITEM_ID\"
              }) { item { id } }
            }" > /dev/null 2>&1

          echo "Issue #$ISSUE_NUMBER archived (off kanban, still in Archived view)"

  # ─── Daily cleanup: archive items in "Готово" ───
  auto-archive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Archive completed items
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          echo "Checking for items in Готово to archive..."

          # Get project number from project ID
          PROJECT_NUMBER=$(gh api graphql -f query="
            {
              {{OWNER_ENTITY}}(login: \"$ORG\") {
                projectsV2(first: 20) {
                  nodes { id number title }
                }
              }
            }" --jq ".data.{{OWNER_ENTITY}}.projectsV2.nodes[] | select(.id == \"$PROJECT_ID\") | .number" 2>/dev/null || true)

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "Could not find project number, trying as user project..."
            PROJECT_NUMBER=$(gh api graphql -f query="
              {
                viewer {
                  projectsV2(first: 20) {
                    nodes { id number title }
                  }
                }
              }" --jq ".data.viewer.projectsV2.nodes[] | select(.id == \"$PROJECT_ID\") | .number" 2>/dev/null || true)
          fi

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: Could not determine project number"
            exit 1
          fi

          echo "Project number: $PROJECT_NUMBER"

          # Fetch all items with their status
          ITEMS_JSON=$(gh api graphql -f query="
            {
              node(id: \"$PROJECT_ID\") {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      updatedAt
                      fieldValueByName(name: \"Status\") {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          optionId
                          name
                        }
                      }
                      content {
                        ... on Issue { number title }
                        ... on PullRequest { number title }
                      }
                    }
                  }
                }
              }
            }" 2>/dev/null || true)

          if [ -z "$ITEMS_JSON" ]; then
            echo "Could not fetch project items"
            exit 1
          fi

          # Find items in "Готово" (STATUS_DONE)
          DONE_ITEMS=$(echo "$ITEMS_JSON" | jq -r "
            .data.node.items.nodes[]
            | select(.fieldValueByName.optionId == \"$STATUS_DONE\")
            | .id
          " 2>/dev/null || true)

          if [ -z "$DONE_ITEMS" ]; then
            echo "No items in Готово — nothing to archive"
            exit 0
          fi

          ARCHIVED=0
          for ITEM_ID in $DONE_ITEMS; do
            # Get item details for logging
            ITEM_TITLE=$(echo "$ITEMS_JSON" | jq -r "
              .data.node.items.nodes[]
              | select(.id == \"$ITEM_ID\")
              | .content.title // \"(no title)\"
            " 2>/dev/null || echo "(unknown)")

            ITEM_NUM=$(echo "$ITEMS_JSON" | jq -r "
              .data.node.items.nodes[]
              | select(.id == \"$ITEM_ID\")
              | .content.number // \"?\"
            " 2>/dev/null || echo "?")

            # Archive = remove from board
            gh api graphql -f query="
              mutation {
                archiveProjectV2Item(input: {
                  projectId: \"$PROJECT_ID\"
                  itemId: \"$ITEM_ID\"
                }) { item { id } }
              }" > /dev/null 2>&1

            echo "  Archived: #$ITEM_NUM — $ITEM_TITLE"
            ARCHIVED=$((ARCHIVED + 1))
          done

          echo "Done. Archived $ARCHIVED item(s) from Готово"
